name: deeplabv3plus
model: deeplabv3plus
backbone: resnet50
pretrained: imagenet
num_classes: 7
ignore_index: 255
label_shift: true

data:
  root: data/raw/LoveDA
  splits: data/splits

train:
  crop: 512
  batch: 4
  accum: 1
  iters: 40000
  lr: 1.0e-4
  weight_decay: 0.01
  optimizer: adamw
  scheduler: poly
  power: 1.0
  warmup_iters: 500
  amp: true
  num_workers: 4
  seed: 3407

aug:
  hflip: 0.5
  vflip: 0.5
  rot90: true
  color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.05}
  scale_jitter: [0.75, 1.25]
  use_color: false

eval:
  crop: 512
  stride: 256
  val_interval: 2000
  early_stop_patience: 8    # 3 太激进：poly 调度 40k，6000 步不涨就停会砍在爬坡期
